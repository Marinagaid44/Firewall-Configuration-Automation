 # this is a basic way to modify the ufw in terminal. now ill show a code to automate this process to bash. for a lot of this servers are going to be associated with IP and ports are associaed with rules
 #!/usr/bin/env bash
set -euo pipefail
IFS=$'\n\t'

# ┌────── CONFIGURATION ────────────────────────────────────────────────────────
# Default files (can be overridden via -i or -p)
INVENTORY="servers.txt"
PORTS_FILE="ports.conf"

# SSH user (root or sudo-enabled user)
SSH_USER="root"

# Action to perform: apply | remove | status
ACTION=""

# ┌────── FUNCTIONS ────────────────────────────────────────────────────────────
usage() {
  cat <<EOF
Usage: $0 -a ACTION [-i INVENTORY] [-p PORTS] [-u SSH_USER]

  -a ACTION      apply | remove | status
  -i INVENTORY   list of servers (default: $INVENTORY)
  -p PORTS       list of ufw rules   (default: $PORTS_FILE)
  -u SSH_USER    user for SSH       (default: $SSH_USER)
  -h             this help
EOF
  exit 1
}

# Run a command over SSH on a remote server
run_remote() {
  local host="$1"; shift
  ssh -o BatchMode=yes -o ConnectTimeout=5 \
      "$SSH_USER@$host" "$*"
}

# ────── APPLY: install UFW if needed, reset, set defaults, add rules, enable
apply_rules() {
  for host in "${SERVERS[@]}"; do
    echo ">>> Applying on $host"
    # Build a single SSH command string joined by && for atomicity
    cmd="
      which ufw >/dev/null 2>&1 || sudo apt-get update -y && sudo apt-get install -y ufw;
      sudo ufw --force reset;
      sudo ufw default deny incoming;
      sudo ufw default allow outgoing;
    "
    for rule in "${RULES[@]}"; do
      cmd+=" sudo ufw allow $rule;"
    done
    cmd+=" sudo ufw --force enable; sudo ufw status verbose;"

    run_remote "$host" "$cmd" \
      && echo "  ✓ $host done" \
      || echo "  ✗ $host FAILED"
  done
}

# ────── REMOVE: reset UFW & disable
remove_rules() {
  for host in "${SERVERS[@]}"; do
    echo ">>> Removing on $host"
    run_remote "$host" "sudo ufw --force reset && sudo ufw disable" \
      && echo "  ✓ $host done" \
      || echo "  ✗ $host FAILED"
  done
}

# ────── STATUS: show current rules
status() {
  for host in "${SERVERS[@]}"; do
    echo ">>> Status on $host"
    run_remote "$host" "sudo ufw status numbered"
  done
}

# ┌────── MAIN ─────────────────────────────────────────────────────────────────
# Parse options
while getopts ":a:i:p:u:h" opt; do
  case $opt in
    a) ACTION="$OPTARG"     ;;
    i) INVENTORY="$OPTARG"  ;;
    p) PORTS_FILE="$OPTARG" ;;
    u) SSH_USER="$OPTARG"   ;;
    *) usage                ;;
  esac
done

# Validate
[[ -z "$ACTION" ]] && usage
[[ ! -f "$INVENTORY" ]] && echo "Error: inventory '$INVENTORY' not found." && exit 1
[[ ! -f "$PORTS_FILE" ]] && echo "Error: ports file '$PORTS_FILE' not found." && exit 1

# Load files into arrays
mapfile -t SERVERS < "$INVENTORY"
mapfile -t RULES   < "$PORTS_FILE"

# Dispatch action
case "$ACTION" in
  apply)  apply_rules  ;;
  remove) remove_rules ;;
  status) status       ;;
  *) echo "Unknown action: $ACTION"; usage ;;
esac
# Explaination set -euo pipefail & IFS, -e: exit on any error, -u: treat unset variables as errors, -o pipefail: catch failures in pipelines, IFS=$'\n\t': safe splitting on newlines only

#run_remote() is A wrapper that calls SSH with non-interactive options (BatchMode + ConnectTimeout).
#Argument parsing Uses getopts for -a, -i, -p, and -u, plus -h for help.
# bellow will be example of how you can use this to appl rules
# Apply rules to all servers
./firewall-manager.sh -a apply

# Check status
./firewall-manager.sh -a status

# Remove/reset rules
./firewall-manager.sh -a remove

# Override inventory or SSH user
./firewall-manager.sh -a apply -i my-servers.txt -u deploy


